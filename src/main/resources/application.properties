server.port=8080
spring.main.banner-mode=off

# Short-lived access token so the refresh redirect is easy to observe
demo.access-token-ttl=10s
demo.refresh-token-ttl=1h

# Wrap the signed JWT in a compact "dir" JWE (nested JWT). Off by default;
# run.sh turns it on with the `encrypt` flag (-Ddemo.encrypt-tokens=true).
demo.encrypt-tokens=false
